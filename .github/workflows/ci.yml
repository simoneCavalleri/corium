name: Corium CI Matrix & Quality Gate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Multi-Platform Build & Test Matrix
  # ---------------------------------------------------------------------------
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: "Linux GCC-14 (Release)"
            os: ubuntu-24.04
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release
          - name: "Linux GCC-13 (Release)"
            os: ubuntu-24.04
            c_compiler: gcc-13
            cpp_compiler: g++-13
            build_type: Release

          # Linux Clang
          - name: "Linux Clang-18 (Release)"
            os: ubuntu-24.04
            c_compiler: clang-18
            cpp_compiler: clang++-18
            build_type: Release

          # macOS
          - name: "macOS AppleClang (Release)"
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          # Windows MSVC
          - name: "Windows MSVC 2022 (Release)"
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCORIUM_BUILD_TESTS=ON
          -DCORIUM_BUILD_BENCHMARKS=ON

      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }} -j4

      - name: Execute CTest Suite
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # ---------------------------------------------------------------------------
  # 2. Clang Sanitizers (ASan + UBSan)
  # ---------------------------------------------------------------------------
  address-sanitizers:
    name: "Clang AddressSanitizer & UBSan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure with Sanitizers
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCORIUM_BUILD_TESTS=ON

      - name: Build Sanitized Test Suite
        run: cmake --build build-san -j4

      - name: Run Sanitized Tests
        env:
          ASAN_OPTIONS: "alloc_dealloc_mismatch=0:detect_leaks=1"
        run: ctest --test-dir build-san --output-on-failure

  # ---------------------------------------------------------------------------
  # 3. ThreadSanitizer (TSan) - Concurrency & Lock-Free Verification
  # ---------------------------------------------------------------------------
  thread-sanitizer:
    name: "Clang ThreadSanitizer (TSan)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure with ThreadSanitizer
        run: >
          cmake -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCORIUM_BUILD_TESTS=ON

      - name: Build TSan Suite
        run: cmake --build build-tsan -j4

      - name: Run TSan Concurrency Verification
        run: ctest --test-dir build-tsan --output-on-failure

  # ---------------------------------------------------------------------------
  # 4. Code Coverage (GCC + lcov)
  # ---------------------------------------------------------------------------
  code-coverage:
    name: "GCC Code Coverage (lcov)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Configure with Coverage
        run: >
          cmake -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCORIUM_ENABLE_COVERAGE=ON
          -DCORIUM_BUILD_TESTS=ON

      - name: Build and Run Tests
        run: |
          cmake --build build-cov -j4
          ctest --test-dir build-cov --output-on-failure

      - name: Generate Coverage Report
        run: |
          lcov --gcov-tool gcov-14 --directory build-cov --capture --output-file coverage.info --ignore-errors mismatch,unused,empty,inconsistent,negative,gcov --rc geninfo_unexecuted_blocks=1
          lcov --gcov-tool gcov-14 --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' '*/samples/*' --output-file coverage_filtered.info --ignore-errors mismatch,unused,empty,inconsistent,negative,gcov --rc geninfo_unexecuted_blocks=1
          lcov --gcov-tool gcov-14 --list coverage_filtered.info --ignore-errors mismatch,unused,empty,inconsistent,negative,gcov --rc geninfo_unexecuted_blocks=1

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corium-coverage-report
          path: coverage_filtered.info

  # ---------------------------------------------------------------------------
  # 5. Single-Header Amalgamation & Bare-Metal Check
  # ---------------------------------------------------------------------------
  single-header-verification:
    name: "Single-Header Synchronization & Bare-Metal Validation"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Single-Header Synchronization
        run: python3 tools/amalgamate.py --check

      - name: Test Single-Header Standalone Compilation (-fno-rtti -fno-exceptions)
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -fno-rtti -fno-exceptions \
            -Isingle_include samples/02_aerospace_flight_controller/main.cpp -o sample_02_single
          ./sample_02_single

  # ---------------------------------------------------------------------------
  # 6. Documentation Coverage & Quality Gate
  # ---------------------------------------------------------------------------
  documentation-quality:
    name: "Documentation Quality & Doxygen Verification"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Documentation Coverage (100% Header Standard)
        run: python3 tools/doc_coverage.py --strict

      - name: Install Doxygen & Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

  # ---------------------------------------------------------------------------
  # 6. Static Analysis (Clang-Tidy Strict Quality Gate)
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: "Clang-Tidy Static Analysis (cert, bugprone, performance, modernize)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang-Tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Generate Compile Commands Database
        run: >
          cmake -B build-tidy
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCORIUM_BUILD_TESTS=ON
          -DCORIUM_BUILD_SAMPLES=ON

      - name: Run Clang-Tidy Verification
        run: |
          clang-tidy-18 -p build-tidy \
            tests/*.cpp samples/*/main.cpp

  # ---------------------------------------------------------------------------
  # 7. Automated GitHub Release on Git Tag
  # ---------------------------------------------------------------------------
  release:
    name: "Publish GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [matrix-build, address-sanitizers, thread-sanitizer, code-coverage, single-header-verification, documentation-quality, clang-tidy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Single-Header
        run: python3 tools/amalgamate.py

      - name: Create Release and Upload Single Header
        uses: softprops/action-gh-release@v2
        with:
          name: "Corium ${{ github.ref_name }} — Production-Ready Zero-Heap C++20 Event Engine"
          body_path: docs/RELEASE_NOTES.md
          files: |
            single_include/corium.hpp
          generate_release_notes: false
